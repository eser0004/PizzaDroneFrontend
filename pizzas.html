<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <h1>Pizzaer</h1>
    <nav>
        <a href="index.html">Leveringer</a>
        <a href="drones.html">Droner</a>
        <a href="stations.html">Stationer</a>
        <a href="pizzas.html" class="active">Pizzaer</a>
    </nav>
</header>

<main>
    <section>
        <h2>Tilføj Pizza</h2>
        <form id="addPizzaForm">
            <label for="pizzaTitle">Pizza Titel:</label>
            <input type="text" id="pizzaTitle" placeholder="Indtast pizza titel" required />

            <label for="pizzaPrice">Pris:</label>
            <input type="number" id="pizzaPrice" placeholder="Indtast pris" required />

            <button type="submit">Tilføj Pizza</button>
        </form>
    </section>

    <section>
        <h2>Liste over Pizzaer</h2>
        <ul id="pizzaList">
            <!-- Liste over pizzaer vil blive tilføjet her dynamisk -->
        </ul>
    </section>
</main>

<footer>
    <p>Drone Pizza © 2025</p>
</footer>

<!-- Sørg for, at config.js er inkluderet først -->
<script src="js/config.js"></script>
<script src="js/pizzas.js"></script>
</body>
</html>
